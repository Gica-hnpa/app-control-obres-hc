<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APP Control d'Obres · V53 Static</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:Arial,Segoe UI,sans-serif;font-size:14px}.app{display:flex;min-height:100vh}.side{width:250px;background:#0f172a;color:white;padding:18px 10px}.brand{padding:0 10px 20px}.brand b{display:block;font-size:18px}.brand span{font-size:12px;color:#bdd7ff}.side button{width:100%;border:0;background:transparent;color:white;text-align:left;padding:13px 14px;border-radius:10px;font-weight:800;cursor:pointer}.side button.active,.side button:hover{background:#2563eb}main{flex:1;padding:0 22px 30px}.top{height:66px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.top p{margin:2px 0 0;color:#64748b}.tag{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:7px 12px;font-weight:900}.mini{display:flex;gap:12px;align-items:center;background:white;border:1px solid #d6dde7;border-radius:14px;padding:10px;margin-bottom:12px}.photo{width:86px;height:54px;border-radius:10px;background:#e5e7eb;display:grid;place-items:center;color:#64748b;font-size:11px;font-weight:900}.tabs,.subtabs{display:flex;gap:8px;margin-bottom:14px}.tabs button,.subtabs button{border:1px solid #d6dde7;background:white;border-radius:9px;padding:10px 14px;font-weight:900;cursor:pointer}.tabs .active,.subtabs .active{background:#111827;color:white}.card{background:white;border:1px solid #d6dde7;border-radius:14px;box-shadow:0 2px 8px #00000008;overflow:hidden;margin-bottom:14px}.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #d6dde7}.card-head h2{font-size:16px;margin:0}.card-body{padding:16px}.primary,.secondary{border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer;background:white}.primary{background:#2563eb;color:white;border-color:#2563eb}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pills{display:flex;gap:10px;flex-wrap:wrap}.pills button{border:1px solid #d6dde7;background:white;border-radius:10px;padding:12px;min-width:118px;text-align:left}.pills button.active{outline:2px solid #2563eb;background:#eff6ff}.pills b,.pills span,.pills strong{display:block;margin:4px 0}.cert-resum{border:1px solid #d6dde7;border-radius:14px;overflow:hidden}.cert-head,.cert-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1.4fr;gap:8px;align-items:center}.cert-head{background:#0f172a;color:white;font-size:12px;font-weight:900;padding:12px 14px}.cert-row{padding:14px;border-bottom:1px solid #e5e7eb}.progress{display:flex;align-items:center;gap:10px}.progress div{height:10px;flex:1;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress i{display:block;height:10px;background:linear-gradient(90deg,#2563eb,#22c55e)}.progress em{font-style:normal;font-weight:900;font-size:12px}.excel-wrap{overflow:auto}.excel{border-collapse:collapse;width:100%;min-width:920px}.excel th,.excel td{border:1px solid #cbd5e1;padding:8px;text-align:right}.excel th{background:#f8fafc}.excel tr.cap{background:#5b9bd5;color:#001b33;font-weight:900}.excel tr.cap td{text-align:left}.excel .concept{text-align:left;min-width:285px}.excel input{width:78px;border:1px solid #86efac;background:#dcfce7;border-radius:7px;padding:6px;text-align:right;font-weight:900}.green{background:#dcfce7;color:#166534;font-weight:900}.kpis,.form,.config{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpis div{border:1px solid #d6dde7;border-radius:12px;padding:14px}.kpis small{display:block;color:#64748b;font-weight:900}.form label,.config label,.params label{font-size:11px;font-weight:900;color:#64748b;text-transform:uppercase}.form input,.config input,.params select{display:block;width:100%;margin-top:5px;border:1px solid #cbd5e1;border-radius:8px;padding:8px;background:white}.simple{width:100%;border-collapse:collapse}.simple th,.simple td{border-bottom:1px solid #e5e7eb;padding:9px;text-align:left}.proforma{border:1px solid #d6dde7;border-radius:14px;overflow:hidden;margin-bottom:16px}.pro-head{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:12px;border-bottom:1px solid #d6dde7}.params{display:flex;gap:12px;padding:12px;border-bottom:1px solid #d6dde7}.pro-table{width:100%;border-collapse:collapse}.pro-table th,.pro-table td{border:1px solid #cbd5e1;padding:10px;text-align:right}.pro-table th{text-align:left;background:#f8fafc}.pro-table .total th,.pro-table .total td{font-size:18px;font-weight:900;background:#e5e7eb}.actions{display:flex;gap:8px}@media print{body *{visibility:hidden!important}.print-target,.print-target *{visibility:visible!important}.print-target{position:absolute!important;top:0!important;left:0!important;width:100%!important;background:white!important;border:0!important}.no-print{display:none!important}}@media(max-width:1000px){.app{display:block}.side{width:100%}.grid3,.kpis,.form,.config{grid-template-columns:1fr}.cert-head,.cert-row{grid-template-columns:1fr}.pro-head,.params{display:grid;grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
const euro=n=>new Intl.NumberFormat("ca-ES",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)+" €", dec=n=>new Intl.NumberFormat("ca-ES",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0), pct=n=>(Number(n)||0).toFixed(2)+"%";
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??f}catch{return f}}, write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)), group=(a,k)=>a.reduce((r,x)=>((r[x[k]]??=[]).push(x),r),{}), today=()=>new Date().toISOString().slice(0,10), uid=()=>Math.random().toString(36).slice(2);
let st=read("aco_v53_static",{screen:"obres",tab:"cert",certMode:"resum",selectedCert:"1",printId:null,config:{email:"",iva:"21",retencio:"0"},obra:{nom:"CP EDIFICI MARICEL",ref:"SOCOTERM · Front de Mar",client:"SOCOTERM",estat:"En procés",pressupost:64485.17,partides:[{cap:"02 MITJANS AUXILIARS",codi:"02.01",ut:"m²",concepte:"BASTIDA",q:519.75,pu:16.50},{cap:"03 TREBALLS PREVIS",codi:"03.01",ut:"m²",concepte:"NETEJAR I SANEJAT",q:756.40,pu:2.60},{cap:"03 TREBALLS PREVIS",codi:"03.02",ut:"m²",concepte:"REPARACIÓ ESQUERDES",q:12,pu:56.74},{cap:"04 REMAT MURETS TERRASSES I BALCONS",codi:"04.01",ut:"m²",concepte:"INTERVENCIÓ MURET PERIMETRAL",q:369.41,pu:84.52},{cap:"05 FAÇANES",codi:"05.01",ut:"m²",concepte:"PINTURA A FAÇANES",q:105.80,pu:17.20},{cap:"05 FAÇANES",codi:"05.02",ut:"h",concepte:"ANTIFISSURES A FAÇANES",q:297.21,pu:65.80},{cap:"10 FEINES FORA PRESSUPOST",codi:"10.01",ut:"m²",concepte:"REPICAT REVESTIMENTS MAL ADHERITS",q:25.80,pu:25.70}],certs:[{id:"c1",numero:"1",data:"2026-05-12"},{id:"c2",numero:"2",data:"2026-06-18"}],certLines:{"1":{"02.01":103.95,"03.01":212.32,"03.02":12,"04.01":21.80,"05.01":50.60,"05.02":86.28,"10.01":0},"2":{"10.01":25.80}},temps:[],factParams:{}}});
function save(){write("aco_v53_static",st)} function set(p){Object.assign(st,p);save();render()}
function certImport(n){let l=st.obra.certLines[String(n)]||{};return st.obra.partides.reduce((s,p)=>s+(+l[p.codi]||0)*p.pu,0)} function certCap(items,n){let l=st.obra.certLines[String(n)]||{};return items.reduce((s,p)=>s+(+l[p.codi]||0)*p.pu,0)} function card(t,b,a=""){return `<section class="card"><div class="card-head"><h2>${t}</h2>${a}</div><div class="card-body">${b}</div></section>`}
function render(){let o=st.obra;app.innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>APP CONTROL D'OBRES</b><span>V53 static sense npm</span></div>${nav("obres","Obres")}${nav("cal","Calendari")}${nav("clients","Clients")}${nav("cfg","Configuració")}</aside><main><header class="top"><div><h1>${st.screen==="obres"?o.nom:title(st.screen)}</h1><p>${st.screen==="obres"?o.client+" · "+o.ref:""}</p></div><div class="tag">${o.estat}</div></header>${main()}</main></div>`}
function title(s){return s==="cal"?"Calendari":s==="clients"?"Clients":"Configuració"} function nav(k,t){return `<button class="${st.screen===k?"active":""}" onclick="set({screen:'${k}'})">${t}</button>`}
function main(){if(st.screen==="cfg")return config();if(st.screen==="clients")return card("Clients","<p>SOCOTERM · info@socoterm.com</p>");if(st.screen==="cal")return card("Calendari","<p>Calendari estable.</p>");return obra()}
function obra(){let tabs=[["resum","Resum"],["cert","Certificacions"],["fact","Facturació"],["temps","Temps invertit"],["docs","Documents"]];return `<div class="mini"><div class="photo">FOTO OBRA</div><div><b>${st.obra.nom}</b><span>${st.obra.client}</span><small>Pressupost: ${euro(st.obra.pressupost)}</small></div></div><div class="tabs">${tabs.map(([k,t])=>`<button class="${st.tab===k?"active":""}" onclick="set({tab:'${k}'})">${t}</button>`).join("")}</div>${st.tab==="resum"?resum():st.tab==="cert"?certificacions():st.tab==="fact"?facturacio():st.tab==="temps"?temps():card("Documents","<p>Documents estabilitzat.</p>")}`}
function resum(){let total=st.obra.certs.reduce((s,c)=>s+certImport(c.numero),0);return `<div class="grid3">${card("Pressupost",`<h3>${euro(st.obra.pressupost)}</h3>`)}${card("Certificat acumulat",`<h3>${euro(total)}</h3>`)}${card("Pendent",`<h3>${euro(Math.max(st.obra.pressupost-total,0))}</h3>`)}</div>`}
function certificacions(){return `<div>${card("Certificacions guardades",`<div class="pills">${st.obra.certs.map(c=>`<button class="${st.selectedCert===String(c.numero)?"active":""}" onclick="set({selectedCert:'${c.numero}'})"><b>Cert. ${c.numero}</b><span>${new Date(c.data).toLocaleDateString("ca-ES")}</span><strong>${euro(certImport(c.numero))}</strong></button>`).join("")}</div>`,`<button class="primary" onclick="alert('Certificació guardada')">Guardar certificació</button>`)}${card("Certificacions",`<div class="subtabs"><button class="${st.certMode==="resum"?"active":""}" onclick="set({certMode:'resum'})">Resum per capítols</button><button class="${st.certMode==="quadre"?"active":""}" onclick="set({certMode:'quadre'})">Quadre detallat</button></div>${st.certMode==="resum"?certResum():certQuadre()}`)}</div>`}
function certResum(){let caps=group(st.obra.partides,"cap"), rows=Object.entries(caps).map(([cap,items])=>{let pres=items.reduce((s,p)=>s+p.q*p.pu,0), vals=st.obra.certs.map(c=>certCap(items,c.numero)), total=vals.reduce((s,x)=>s+x,0), pend=Math.max(pres-total,0), perc=pres?Math.min(total/pres*100,100):0;return{cap,pres,vals,total,pend,perc}});return `<div class="cert-resum"><div class="cert-head"><span>CAPÍTOL</span><span>PRESSUPOST</span>${st.obra.certs.map(c=>`<span>CERT. ${c.numero}</span>`).join("")}<span>TOTAL CERT.</span><span>PENDENT</span><span>% EXECUTAT</span></div>${rows.map(r=>`<div class="cert-row"><b>${r.cap}</b><span>${euro(r.pres)}</span>${r.vals.map(v=>`<span>${euro(v)}</span>`).join("")}<strong>${euro(r.total)}</strong><span>${euro(r.pend)}</span>${progress(r.perc)}</div>`).join("")}</div>`}
function progress(v){return `<div class="progress"><div><i style="width:${Math.min(v,100)}%"></i></div><em>${pct(v)}</em></div>`}
function certQuadre(){let caps=group(st.obra.partides,"cap"), lines=st.obra.certLines[st.selectedCert]||{}, total=st.obra.partides.reduce((s,p)=>s+(+lines[p.codi]||0)*p.pu,0);return `<div class="excel-wrap"><table class="excel"><thead><tr><th>Partida</th><th>Ut</th><th>Resum</th><th>CanPres</th><th>PrPres</th><th>ImpPres</th><th>Q act.</th><th>% act.</th><th>Imp act.</th></tr></thead><tbody>${Object.entries(caps).map(([cap,items])=>`<tr class="cap"><td colspan="9">${cap}</td></tr>${items.map(p=>{let q=+lines[p.codi]||0,pc=p.q?q/p.q*100:0,im=q*p.pu;return `<tr><td>${p.codi}</td><td>${p.ut}</td><td class="concept">${p.concepte}</td><td>${dec(p.q)}</td><td>${euro(p.pu)}</td><td>${euro(p.q*p.pu)}</td><td class="${q>0?"green":""}"><input type="number" step="0.01" value="${q}" onchange="updateCert('${p.codi}',this.value)"></td><td class="${q>0?"green":""}">${pc.toFixed(2)}%</td><td class="${q>0?"green":""}">${euro(im)}</td></tr>`}).join("")}`).join("")}</tbody><tfoot><tr><th colspan="8">TOTAL CERTIFICACIÓ ${st.selectedCert}</th><th>${euro(total)}</th></tr></tfoot></table></div>`}
function updateCert(c,v){let n=st.selectedCert;st.obra.certLines[n]={...(st.obra.certLines[n]||{}),[c]:v};save();render()}
function facturacio(){return card("Factures proforma",st.obra.certs.map(c=>proforma(c)).join(""))}
function opts(a,c){return a.map(v=>`<option value="${v}" ${String(c)===v?"selected":""}>${v}%</option>`).join("")}
function proforma(c){let p=st.obra.factParams[c.id]||{iva:st.config.iva,retencio:st.config.retencio,deduccio:"0"},b=certImport(c.numero),d=b*(+p.deduccio||0)/100,sub=b-d,iva=sub*(+p.iva||0)/100,ret=sub*(+p.retencio||0)/100,total=sub+iva-ret;return `<div class="proforma ${st.printId===c.id?"print-target":""}"><div class="pro-head"><div><b>Proforma certificació ${c.numero}</b><span>${new Date(c.data).toLocaleDateString("ca-ES")}</span></div><div class="actions no-print"><button onclick="printOne('${c.id}')">Imprimir / PDF</button><button onclick="gmail('${c.numero}','${euro(b)}','${euro(total)}')">Gmail</button></div></div><div class="params no-print"><label>IVA<select onchange="updateFact('${c.id}','iva',this.value)">${opts(["0","10","21"],p.iva)}</select></label><label>Retenció<select onchange="updateFact('${c.id}','retencio',this.value)">${opts(["0","7","15","19"],p.retencio)}</select></label><label>Deducció<select onchange="updateFact('${c.id}','deduccio',this.value)">${opts(["0","5","10"],p.deduccio)}</select></label></div><table class="pro-table"><tbody><tr><th>Base certificada</th><td>${euro(b)}</td></tr><tr><th>Deducció (${p.deduccio}%)</th><td>- ${euro(d)}</td></tr><tr><th>Subtotal</th><td>${euro(sub)}</td></tr><tr><th>IVA (${p.iva}%)</th><td>${euro(iva)}</td></tr><tr><th>Retenció (${p.retencio}%)</th><td>- ${euro(ret)}</td></tr><tr class="total"><th>Total</th><td>${euro(total)}</td></tr></tbody></table></div>`}
function updateFact(id,k,v){st.obra.factParams[id]={...(st.obra.factParams[id]||{iva:st.config.iva,retencio:st.config.retencio,deduccio:"0"}),[k]:v};save();render()}
function printOne(id){st.printId=id;save();render();setTimeout(()=>{window.print();setTimeout(()=>{st.printId=null;save();render()},500)},100)}
function gmail(n,b,t){window.open("https://mail.google.com/mail/?view=cm&fs=1&su="+encodeURIComponent("Proforma certificació "+n)+"&body="+encodeURIComponent("Base: "+b+"\\nTotal: "+t),"_blank")}
function temps(){let rows=st.obra.temps||[],n=v=>+String(v||0).replace(",",".")||0,totalRow=r=>n(r.hores)*n(r.preuHora)+n(r.km)*n(r.preuKm)+n(r.altres);return `<div>${card("Temps invertit / honoraris",`<div class="kpis"><div><small>HORES</small><b>${dec(rows.reduce((s,r)=>s+n(r.hores),0))} h</b></div><div><small>KM</small><b>${dec(rows.reduce((s,r)=>s+n(r.km),0))} km</b></div><div><small>TOTAL</small><b>${euro(rows.reduce((s,r)=>s+totalRow(r),0))}</b></div></div>`)}${card("Nou registre",`<div class="form"><label>Data<input id="tdata" type="date" value="${today()}"></label><label>Tipus<input id="ttipus" value="Pressupost"></label><label>Tasca<input id="ttasca"></label><label>Hores<input id="thores" type="number" value="1.00"></label><label>€/h<input id="tpreu" type="number" value="50.00"></label><label>Km<input id="tkm" type="number" value="0"></label><label>€/km<input id="tpreukm" type="number" value="0.30"></label><label>Altres<input id="taltres" type="number" value="0"></label></div><button class="primary" onclick="addTime()">Afegir registre</button>`)}${card("Registres",`<table class="simple"><thead><tr><th>Data</th><th>Tipus</th><th>Tasca</th><th>Hores</th><th>€/h</th><th>Km</th><th>Altres</th><th>Total</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.data}</td><td>${r.tipus}</td><td>${r.tasca}</td><td>${dec(r.hores)}</td><td>${euro(r.preuHora)}</td><td>${dec(r.km)}</td><td>${euro(r.altres)}</td><td><b>${euro(totalRow(r))}</b></td></tr>`).join("")}</tbody></table>`)}</div>`}
function addTime(){st.obra.temps.unshift({id:uid(),data:tdata.value,tipus:ttipus.value,tasca:ttasca.value,hores:thores.value,preuHora:tpreu.value,km:tkm.value,preuKm:tpreukm.value,altres:taltres.value});save();render()}
function config(){return card("Configuració",`<div class="config"><label>Email<input value="${st.config.email}" onchange="st.config.email=this.value;save()"></label><label>IVA<input value="${st.config.iva}" onchange="st.config.iva=this.value;save()"></label><label>Retenció<input value="${st.config.retencio}" onchange="st.config.retencio=this.value;save()"></label></div>`)}
render();
</script></body></html>
